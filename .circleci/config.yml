version: 2.1
jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "requirements.txt" }}
            - v1-deps-
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Install pytest
          command: pip install pytest
      - save_cache:
          paths:
            - ~/.cache/pip
          key: v1-deps-{{ checksum "requirements.txt" }}
      - run:
          name: Run tests
          command: pytest
workflows:
  version: 2
  build_and_test:
    jobs:
      - build-and-test